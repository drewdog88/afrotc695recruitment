name: Sync Wiki Content

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout main repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for the wiki repo
        
    - name: Checkout wiki repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}.wiki
        path: wiki-repo
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Sync wiki files
      run: |
        echo "Syncing wiki files from wiki/ directory to GitHub Wiki..."
        
        # Copy all markdown files from wiki/ to wiki-repo/
        cp wiki/*.md wiki-repo/
        
        # List what we're syncing
        echo "Files being synced:"
        ls -la wiki/
        echo ""
        echo "Files in wiki repository:"
        ls -la wiki-repo/
        
    - name: Check for changes
      id: check-changes
      run: |
        cd wiki-repo
        if [ -n "$(git status --porcelain)" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected, will commit and push"
        else
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        fi
        
    - name: Commit and push changes
      if: steps.check-changes.outputs.changes == 'true'
      run: |
        cd wiki-repo
        
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add all changes
        git add .
        
        # Commit with descriptive message
        git commit -m "Auto-sync wiki content from main repository
        
        Synced from wiki/ directory:
        - Development Process (Cursor & Taskmaster)
        - Vercel Blob Storage
        - Cursor & Vercel Integration
        - Neon Database
        - Testing Strategy
        - Development Roadmap
        
        Auto-generated by GitHub Actions workflow."
        
        # Push to wiki repository
        git push origin main
        
    - name: Summary
      run: |
        if [ "${{ steps.check-changes.outputs.changes }}" == "true" ]; then
          echo "✅ Wiki content successfully synced!"
          echo "📚 Updated wiki pages:"
          ls wiki/*.md | sed 's/wiki\//  - /'
        else
          echo "ℹ️ No changes detected - wiki is already up to date"
        fi

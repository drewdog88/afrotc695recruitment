name: Sync Wiki Content

on:
  push:
    branches:
      - master
    paths:
      - 'wiki/**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout main repository
      uses: actions/checkout@v4
      
    - name: Setup Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
    - name: Clone wiki repository
      run: |
        # Clone the wiki repository using Personal Access Token
        git clone https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.wiki.git wiki-repo
        
        # Check what branch we're on
        cd wiki-repo
        echo "Current branch: $(git branch --show-current)"
        
    - name: Sync wiki files
      run: |
        echo "Syncing wiki files from wiki/ directory to GitHub Wiki..."
        
        # Copy all markdown files from wiki/ to wiki-repo/
        cp wiki/*.md wiki-repo/
        
        # List what we're syncing
        echo "Files being synced:"
        ls -la wiki/
        echo ""
        echo "Files in wiki repository:"
        ls -la wiki-repo/
        
    - name: Check for changes
      id: check-changes
      run: |
        cd wiki-repo
        if [ -n "$(git status --porcelain)" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected, will commit and push"
        else
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        fi
        
    - name: Commit and push changes
      if: steps.check-changes.outputs.changes == 'true'
      run: |
        cd wiki-repo
        
        # Get the current branch name
        CURRENT_BRANCH=$(git branch --show-current)
        echo "Pushing to branch: $CURRENT_BRANCH"
        
        # Add all changes
        git add .
        
        # Commit with descriptive message
        git commit -m "Auto-sync wiki content from main repository
        
        Synced from wiki/ directory:
        - Development Process (Cursor & Taskmaster)
        - Vercel Blob Storage
        - Cursor & Vercel Integration
        - Neon Database
        - Testing Strategy
        - Development Roadmap
        
        Auto-generated by GitHub Actions workflow."
        
        # Push to wiki repository using Personal Access Token
        git push https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.wiki.git $CURRENT_BRANCH
        
    - name: Summary
      run: |
        if [ "${{ steps.check-changes.outputs.changes }}" == "true" ]; then
          echo "✅ Wiki content successfully synced!"
          echo "📚 Updated wiki pages:"
          ls wiki/*.md | sed 's/wiki\//  - /'
        else
          echo "ℹ️ No changes detected - wiki is already up to date"
        fi

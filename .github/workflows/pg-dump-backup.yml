name: Nightly Postgres Backup

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2 AM UTC
  workflow_dispatch: # Allows manual triggering from GitHub UI

env:
  # Define environment variables for your database and Cloudflare R2
  DATABASE_URL: ${{ secrets.DATABASE_URL }} # PostgreSQL connection string
  R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT_URL: "https://kre9xoivjggj03of.public.blob.vercel-storage.com"
  FOLDER_NAME: postgres-backups
  RETENTION: 30 # Number of days to retain backups

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ env.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ env.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ env.R2_ENDPOINT_URL }}
          region = auto
          EOF

      - name: Run pg_dump and gzip
        run: |
          GZIP_NAME="${{ env.FOLDER_NAME }}/$(date +%Y-%m-%d_%H-%M-%S).sql.gz"
          pg_dump "${{ env.DATABASE_URL }}" | gzip > "${GZIP_NAME}"
          echo "GZIP_NAME=${GZIP_NAME}" >> $GITHUB_ENV

      - name: Cleanup old backups
        run: |
          THRESHOLD_DATE=$(date -d "-${{ env.RETENTION }} days" +%Y-%m-%dT%H:%M:%SZ)
          # List old backups and delete them
          rclone lsf r2:${{ env.R2_BUCKET_NAME }}/${{ env.FOLDER_NAME }}/ --include "*.gz" | while read -r file; do
            if [ ! -z "$file" ]; then
              # Get file modification time and compare
              FILE_DATE=$(rclone lsl r2:${{ env.R2_BUCKET_NAME }}/${{ env.FOLDER_NAME }}/$file | awk '{print $2, $3}')
              FILE_TIMESTAMP=$(date -d "$FILE_DATE" +%s)
              THRESHOLD_TIMESTAMP=$(date -d "$THRESHOLD_DATE" +%s)
              
              if [ "$FILE_TIMESTAMP" -lt "$THRESHOLD_TIMESTAMP" ]; then
                rclone delete r2:${{ env.R2_BUCKET_NAME }}/${{ env.FOLDER_NAME }}/$file
                echo "Deleted old backup: $file"
              fi
            fi
          done

      - name: Upload to R2
        run: |
          rclone copy "${{ env.GZIP_NAME }}" r2:${{ env.R2_BUCKET_NAME }}/${{ env.FOLDER_NAME }}/
          echo "✅ Uploaded backup to Cloudflare R2: ${{ env.GZIP_NAME }}"

      - name: Backup Summary
        run: |
          echo "🎉 Daily pg_dump backup completed successfully!"
          echo "📁 Backup file: ${{ env.GZIP_NAME }}"
          echo "📅 Date: $(date)"
          echo "💾 Storage: Cloudflare R2 via rclone"
name: PostgreSQL pg_dump Backup

on:
  schedule:
    # Run weekly on Sundays at 3:00 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:  # Allow manual triggers

jobs:
  pg-dump-backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      - name: Create pg_dump backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Creating pg_dump backup at $(date)"

          # Create timestamp for filename
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="afrotc695_pgdump_${TIMESTAMP}.sql"

          # Run pg_dump
          pg_dump "$DATABASE_URL" > "$BACKUP_FILE"

          # Check if backup was created successfully
          if [ -s "$BACKUP_FILE" ]; then
            echo "✅ pg_dump backup created successfully: $BACKUP_FILE"
            echo "Backup size: $(du -h $BACKUP_FILE | cut -f1)"
          else
            echo "❌ pg_dump backup failed - file is empty or doesn't exist"
            exit 1
          fi

          # Also create a compressed version
          gzip "$BACKUP_FILE"
          echo "✅ Compressed backup: ${BACKUP_FILE}.gz"

      - name: Upload to R2 Storage
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: |
          # Configure AWS CLI for R2
          aws configure set aws_access_key_id "$CLOUDFLARE_R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"

          # Upload to R2
          aws s3 cp "afrotc695_pgdump_${TIMESTAMP}.sql.gz" \
            "s3://$CLOUDFLARE_R2_BUCKET_NAME/backups/pgdump/" \
            --endpoint-url="https://kre9xoivjggj03of.public.blob.vercel-storage.com"

          echo "✅ Backup uploaded to R2: afrotc695_pgdump_${TIMESTAMP}.sql.gz"

      - name: Cleanup old backups (keep last 4 weeks)
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
        run: |
          # List and delete old pg_dump backups (keep last 4)
          aws s3 ls "s3://$CLOUDFLARE_R2_BUCKET_NAME/backups/pgdump/" \
            --endpoint-url="https://kre9xoivjggj03of.public.blob.vercel-storage.com" \
            --recursive | sort -r | tail -n +5 | awk '{print $4}' | \
            xargs -I {} aws s3 rm "s3://$CLOUDFLARE_R2_BUCKET_NAME/{}" \
            --endpoint-url="https://kre9xoivjggj03of.public.blob.vercel-storage.com"

          echo "✅ Cleaned up old pg_dump backups"

      - name: Backup Summary
        run: |
          echo "🎉 Weekly pg_dump backup completed successfully!"
          echo "📁 Backup file: afrotc695_pgdump_${TIMESTAMP}.sql.gz"
          echo "📅 Date: $(date)"
          echo "💾 Storage: Cloudflare R2"

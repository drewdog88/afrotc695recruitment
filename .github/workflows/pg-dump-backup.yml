name: Nightly Postgres Backup

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2 AM UTC
  workflow_dispatch: # Allows manual triggering from GitHub UI

env:
  # Define environment variables for your database and Cloudflare R2
  DATABASE_URL: ${{ secrets.DATABASE_URL }} # PostgreSQL connection string
  R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FOLDER_NAME: postgres-backups
  RETENTION: 30 # Number of days to retain backups

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Wrangler CLI
        run: |
          npm install -g wrangler

      - name: Configure Wrangler for R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Wrangler configured with API token"

      - name: Run pg_dump and gzip
        run: |
          GZIP_NAME="${{ env.FOLDER_NAME }}/$(date +%Y-%m-%d_%H-%M-%S).sql.gz"
          pg_dump "${{ env.DATABASE_URL }}" | gzip > "${GZIP_NAME}"
          echo "GZIP_NAME=${GZIP_NAME}" >> $GITHUB_ENV

      - name: Cleanup old backups
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          THRESHOLD_DATE=$(date -d "-${{ env.RETENTION }} days" +%Y-%m-%dT%H:%M:%SZ)
          # List old backups and delete them
          wrangler r2 object list ${{ env.R2_BUCKET_NAME }} --prefix="${{ env.FOLDER_NAME }}/" --json | \
          jq -r ".[] | select(.uploaded < \"$THRESHOLD_DATE\") | select(.key | endswith(\".gz\")) | .key" | \
          while read -r file; do
            if [ ! -z "$file" ]; then
              wrangler r2 object delete ${{ env.R2_BUCKET_NAME }} "$file"
              echo "Deleted old backup: $file"
            fi
          done

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler r2 object put ${{ env.R2_BUCKET_NAME }}/${{ env.GZIP_NAME }} --file="${{ env.GZIP_NAME }}"
          echo "✅ Uploaded backup to Cloudflare R2: ${{ env.GZIP_NAME }}"

      - name: Backup Summary
        run: |
          echo "🎉 Daily pg_dump backup completed successfully!"
          echo "📁 Backup file: ${{ env.GZIP_NAME }}"
          echo "📅 Date: $(date)"
          echo "💾 Storage: Cloudflare R2"

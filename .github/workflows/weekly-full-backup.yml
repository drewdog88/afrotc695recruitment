name: Weekly Full System Backup

on:
  schedule:
    - cron: '0 7 * * 6' # Runs weekly on Saturday at 7 AM UTC (Friday 11 PM PST)
  workflow_dispatch: # Allows manual triggering from GitHub UI

env:
  # Define environment variables for your database and storage
  DATABASE_URL: ${{ secrets.DATABASE_URL }} # PostgreSQL connection string
  R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
  R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
  FOLDER_NAME: weekly-full-backups

jobs:
  full-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client (version 17)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          echo "deb http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for Cloudflare R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Other
          access_key_id = ${{ env.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ env.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ env.R2_ENDPOINT_URL }}
          acl = private
          no_check_bucket = true
          EOF

      - name: Create backup directory structure
        run: |
          mkdir -p "${{ env.FOLDER_NAME }}/database"
          mkdir -p "${{ env.FOLDER_NAME }}/documents"
          mkdir -p "${{ env.FOLDER_NAME }}/existing-backups"
          echo "Created backup directory structure"

      - name: Create fresh database dump
        run: |
          DB_DUMP_NAME="${{ env.FOLDER_NAME }}/database/$(date +%Y-%m-%d_%H-%M-%S)_database.sql.gz"
          /usr/lib/postgresql/17/bin/pg_dump "${{ env.DATABASE_URL }}" | gzip > "${DB_DUMP_NAME}"
          echo "DB_DUMP_NAME=${DB_DUMP_NAME}" >> $GITHUB_ENV
          echo "✅ Created fresh database dump: ${DB_DUMP_NAME}"

      - name: Test R2 connectivity and list contents
        run: |
          # Test basic connectivity first
          echo "🔍 Testing R2 connectivity..."
          echo "Bucket name: ${{ env.R2_BUCKET_NAME }}"
          echo "Endpoint: ${{ env.R2_ENDPOINT_URL }}"
          
          # Test if we can access the bucket at all
          echo "📋 Testing bucket access..."
          rclone lsd r2: || echo "❌ Cannot list buckets - check credentials and endpoint"
          
          # Try to list bucket contents
          echo "📋 Listing R2 bucket contents (all files):"
          rclone ls r2:${{ env.R2_BUCKET_NAME }}/ || echo "❌ Could not list bucket contents"
          
          echo "📋 Listing documents folder specifically:"
          rclone ls r2:${{ env.R2_BUCKET_NAME }}/documents/ || echo "❌ Could not list documents folder"

      - name: Download all documents from R2
        run: |
          # Try to download from documents folder first
          echo "📁 Attempting to download from /documents/ folder..."
          if rclone copy r2:${{ env.R2_BUCKET_NAME }}/documents/ "${{ env.FOLDER_NAME }}/documents/" 2>/dev/null; then
            echo "✅ Downloaded documents from /documents/ folder"
          else
            echo "⚠️  /documents/ folder not found, trying root directory..."
            # If documents folder doesn't exist, try downloading from root
            rclone copy r2:${{ env.R2_BUCKET_NAME }}/ "${{ env.FOLDER_NAME }}/documents/" --include "*.pdf" --include "*.doc" --include "*.docx" --include "*.txt" --include "*.jpg" --include "*.png" --include "*.gif" || echo "No documents found in root directory"
            echo "✅ Downloaded documents from root directory"
          fi

      - name: Download existing backups from R2
        run: |
          # Download all existing backup files from R2 (if they exist)
          echo "📁 Attempting to download existing postgres backups..."
          if rclone copy r2:${{ env.R2_BUCKET_NAME }}/postgres-backups/ "${{ env.FOLDER_NAME }}/existing-backups/" --include "*.gz" 2>/dev/null; then
            echo "✅ Downloaded existing postgres backups"
          else
            echo "⚠️  No existing postgres backups found (this is normal for first run)"
          fi
          
          echo "📁 Attempting to download existing weekly backups..."
          if rclone copy r2:${{ env.R2_BUCKET_NAME }}/weekly-full-backups/ "${{ env.FOLDER_NAME }}/existing-backups/" --include "*.tar.gz" 2>/dev/null; then
            echo "✅ Downloaded existing weekly backups"
          else
            echo "⚠️  No existing weekly backups found (this is normal for first run)"
          fi
          
          echo "✅ Completed existing backup download attempt"

      - name: Create comprehensive tar.gz backup
        run: |
          BACKUP_NAME="afrotc695_full_backup_$(date +%Y-%m-%d_%H-%M-%S).tar.gz"
          tar -czf "${BACKUP_NAME}" "${{ env.FOLDER_NAME }}/"
          echo "BACKUP_NAME=${BACKUP_NAME}" >> $GITHUB_ENV
          echo "✅ Created comprehensive backup: ${BACKUP_NAME}"

      - name: Upload comprehensive backup to R2
        run: |
          rclone copy "${{ env.BACKUP_NAME }}" r2:${{ env.R2_BUCKET_NAME }}/${{ env.FOLDER_NAME }}/
          echo "✅ Uploaded comprehensive backup to Cloudflare R2: ${{ env.BACKUP_NAME }}"

      - name: Backup Summary
        run: |
          echo "🎉 Weekly full system backup completed successfully!"
          echo "📁 Backup file: ${{ env.BACKUP_NAME }}"
          echo "📅 Date: $(date)"
          echo "💾 Storage: Cloudflare R2 via rclone"
          echo "📊 Contents:"
          echo "   - Fresh database dump"
          echo "   - All documents from R2 storage"
          echo "   - All existing backup files"
          echo "   - Compressed into single tar.gz archive"